# Publicar SOLO la lista blanca de scripts/build-site.mjs (mismo build que GitHub Pages)
[build]
  command = "node scripts/build-site.mjs"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"

# Segunda barrera: los archivos internos devuelven 404
[[redirects]]
  from = "/golive/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/plan.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/LEEME*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/PERF-CAMBIOS.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/_config.yml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caché: los archivos no llevan hash, por eso solo las fuentes (casi nunca cambian) son immutable.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Fotos de autos (assets/): sin hash en el nombre, igual criterio que images/.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# CSS con hash de contenido (lo genera scripts/build-site.mjs): se puede cachear para siempre.
[[headers]]
  for = "/css/horizonte.*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
